spring.application.name=indecsa-api

# Server - Railway inyecta PORT
server.port=${PORT:8080}
server.address=0.0.0.0

# Datasource (lee de variables de entorno; defaults apuntan al RDS)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://indecsa.ckdswk2qi4gd.us-east-1.rds.amazonaws.com:3306/indecsa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n0m3l0l0}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - no abortar arranque si la BD no responde (deja que /liveness suba)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA / Hibernate - NO tocar esquema, ya existe
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Respetar nombres de tablas/columnas tal cual estan declarados (la BD usa Mayusculas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Actuator (health para Railway)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# DevTools off en prod
spring.devtools.restart.enabled=false
