spring.application.name=indecsa-api

# --- SERVIDOR (Railway inyecta PORT) ---
server.port=${PORT:8080}
server.address=0.0.0.0

# --- DATASOURCE (Base de datos) ---
# En local toma los defaults (MySQL en localhost:3306, base 'indecsa', user 'root' sin password).
# En Railway define las variables DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD y estas ganan.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:indecsa}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Driver moderno de MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HIKARICP (Resiliencia en arranque para la nube) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA / HIBERNATE ---
# 'update' como pediste (ver advertencia: en produccion puede dejar el esquema inconsistente con el tiempo).
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Dialecto y metadata consolidados
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Respetar nombres exactos de tablas/columnas (Mayusculas/Minusculas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# --- JACKSON ---
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# --- CORS ---
# Origenes permitidos separados por coma. En Railway define CORS_ALLOWED_ORIGINS con el dominio del frontend.
# Default cubre los puertos tipicos de desarrollo (Vite 5173, React 3000, Angular 4200).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# --- ACTUATOR (Healthchecks de Railway) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# --- DEVTOOLS ---
spring.devtools.restart.enabled=false
